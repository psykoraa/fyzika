<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fyzika — Měření</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef5ee;
  --surface:#fbfef9;
  --surface-2:#dce8da;
  --ink:#1f2e22;
  --ink-soft:#5c705d;
  --line:rgba(31,46,34,0.12);
  --accent:#2f7a4f;
  --accent-ink:#f2fbf5;
  --success:#28794f;
  --success-bg:#e3efe0;
  --danger:#b3392b;
  --danger-bg:#f5e4de;
  --focus:#1e6f66;
  --shadow: 0 1px 0 rgba(31,46,34,0.06);
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:
    linear-gradient(var(--line) 1px, transparent 1px) 0 0/100% 34px,
    linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/34px 100%,
    var(--paper);
  background-attachment:local;
  color:var(--ink);
  font-family:'Work Sans', system-ui, sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{ text-wrap:balance; margin:0; }
.wrap{
  max-width:900px;
  margin:0 auto;
  padding:28px 20px 60px;
}
.back-link{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:0.82rem;
  font-weight:500;
  color:var(--ink-soft);
  text-decoration:none;
  margin-bottom:14px;
}
.back-link:hover{ color:var(--accent); }

.hero{
  text-align:center;
  padding:64px 20px 44px;
}
.hero-tag{
  display:inline-block;
  font-family:'IBM Plex Mono', monospace;
  font-size:0.72rem;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--ink-soft);
  background:var(--surface-2);
  padding:5px 13px;
  border-radius:999px;
  margin-bottom:22px;
}
.hero h1{
  font-family:'Big Shoulders Display', sans-serif;
  font-weight:800;
  font-size:clamp(2.2rem, 8vw, 3.8rem);
  letter-spacing:0.01em;
  line-height:0.95;
  color:var(--ink);
}
.hero .subtitle{
  margin:16px 0 0;
  font-family:'Big Shoulders Display', sans-serif;
  font-weight:700;
  font-size:clamp(1.3rem, 4vw, 1.9rem);
  letter-spacing:0.03em;
  color:var(--accent);
}

.section-tag{
  font-size:0.68rem;
  text-transform:uppercase;
  letter-spacing:0.1em;
  color:var(--ink-soft);
  font-weight:600;
  margin-bottom:8px;
}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:36px 30px;
  text-align:center;
}
.card h2{
  font-family:'Big Shoulders Display', sans-serif;
  font-weight:700;
  font-size:1.4rem;
  letter-spacing:0.03em;
  color:var(--ink-soft);
  text-transform:uppercase;
  margin-bottom:14px;
}
.card p{
  max-width:520px;
  margin:0 auto;
  font-size:0.95rem;
  line-height:1.55;
  color:var(--ink);
}
.card + .card{ margin-top:20px; }

.actions{
  margin-top:28px;
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}
a.btn{
  font-family:'Work Sans', sans-serif;
  font-weight:600;
  font-size:0.95rem;
  padding:12px 24px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
  transition:transform .05s ease, background .12s, filter .12s;
}
a.btn:active{ transform:translateY(1px); }
a.btn.primary{
  background:var(--accent);
  border-color:var(--accent);
  color:var(--accent-ink);
}
a.btn.primary:hover{ filter:brightness(1.06); }
a.btn:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }

footer{
  margin-top:40px;
  text-align:center;
  font-size:0.76rem;
  color:var(--ink-soft);
}

@media (max-width:520px){
  .hero{ padding:44px 16px 32px; }
  .card{ padding:28px 18px; }
}
</style>
</head>
<body>

<div class="wrap">

  <a class="back-link" href="index.html">← Zpět na rozcestník</a>

  <div class="hero">
    <span class="hero-tag">Gymnázium</span>
    <h1>Měření</h1>
  </div>

  <div class="card">
    <div class="section-tag">Měření</div>
    <h2>Zpracování naměřených dat</h2>
    <p>Procvičte si správné zaokrouhlování průměru, odchylky a relativní odchylky naměřených hodnot.</p>
    <div class="actions">
      <a class="btn primary" href="zaokrouhlovani-vysledku.html">Zaokrouhlování měření →</a>
    </div>
  </div>

  <footer>Fyzika — Měření</footer>
</div>

</body>
</html>
