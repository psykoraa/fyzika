<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Průměrná a okamžitá rychlost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="../spolecne/config.js"></script>
<script src="../spolecne/auth.js"></script>
<link rel="stylesheet" href="../spolecne/styl.css">
<style>
:root{
  --paper:#f5f0e3;
  --surface:#fffcf5;
  --surface-2:#ece4d1;
  --ink:#212b34;
  --ink-soft:#5d6b76;
  --line:rgba(33,43,52,0.12);
  --accent:#c9581f;
  --accent-ink:#fff8f0;
  --success:#28794f;
  --success-bg:#e3efe0;
  --danger:#b3392b;
  --danger-bg:#f5e4de;
  --focus:#1e6f66;
  --shadow: 0 1px 0 rgba(33,43,52,0.06);
}

.panel{ margin-bottom:22px; }
.panel-title{ margin-bottom:8px; display:block; }
.panel p{
  margin:0 0 8px;
  font-size:0.9rem;
  line-height:1.55;
}
.panel p:last-child{ margin-bottom:0; }
.panel b{ color:var(--ink); }

.card{ padding:26px 26px 28px; text-align:left; margin-bottom:24px; }
.cat-tag{ margin-bottom:10px; }
.card h2{
  font-family:'Big Shoulders Display', sans-serif;
  font-weight:700;
  font-size:1.6rem;
  letter-spacing:0.02em;
  color:var(--ink);
}
.card .desc{
  font-size:0.86rem;
  color:var(--ink-soft);
  line-height:1.5;
  max-width:60ch;
  margin-top:2px;
}

.video-wrap{
  position:relative;
  width:100%;
  padding-top:56.25%; /* poměr stran 16:9 */
  margin-top:14px;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
}
.video-wrap iframe{
  position:absolute;
  top:0; left:0;
  width:100%;
  height:100%;
  border:0;
}

@media (max-width:520px){
  .card{ padding:20px 16px 22px; }
}
</style>
</head>
<body>

<div class="wrap">

  <a class="back-link" href="../rozcestniky/kvinta.html">← Zpět na Kvinta/1. ročník</a>

  <div class="brand">
    <div class="brand-lockup">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <line x1="6" y1="30" x2="34" y2="30" stroke="var(--ink-soft)" stroke-width="1.4"/>
        <circle cx="10" cy="30" r="3" fill="var(--accent)"/>
        <path d="M10,30 Q20,8 34,10" stroke="var(--focus)" stroke-width="2.2" fill="none" stroke-dasharray="4 4"/>
        <circle cx="34" cy="10" r="3" fill="var(--focus)"/>
      </svg>
      <div class="brand-text">
        <h1>Průměrná a okamžitá rychlost</h1>
        <p>kinematika hmotného bodu</p>
      </div>
    </div>
  </div>

  <div class="top-tabs">
    <button class="toptab on" id="top-tab-teorie" data-tab="teorie">Teorie</button>
    <button class="toptab" id="top-tab-video" data-tab="video">Video</button>
  </div>

  <div id="theory-section" class="tab-section">
    <div class="panel">
      <div class="panel-title">Teorie</div>
      <p>Zatím prázdné.</p>
    </div>
  </div>

  <div id="video-section" class="tab-section" hidden>
    <div class="card">
      <span class="cat-tag">Video</span>
      <h2>Průměrná a okamžitá rychlost</h2>
      <div class="video-wrap">
        <iframe src="https://www.youtube.com/embed/nuBnP_GH_20" title="Průměrná a okamžitá rychlost" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <footer>Fyzika — Kvinta/1. ročník</footer>
</div>

<script src="../spolecne/spolecne.js"></script>
<script>
(function(){
  "use strict";

  var topTabTeorie = document.getElementById('top-tab-teorie');
  var topTabVideo = document.getElementById('top-tab-video');
  var theorySection = document.getElementById('theory-section');
  var videoSection = document.getElementById('video-section');

  function showTopTab(tab){
    topTabTeorie.classList.toggle('on', tab==='teorie');
    topTabVideo.classList.toggle('on', tab==='video');
    theorySection.hidden = tab!=='teorie';
    videoSection.hidden = tab!=='video';
  }

  topTabTeorie.addEventListener('click', function(){ showTopTab('teorie'); });
  topTabVideo.addEventListener('click', function(){ showTopTab('video'); });
})();
</script>

</body>
</html>
