<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fyzika — Rozcestník</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="auth.js"></script>
<link rel="stylesheet" href="styl.css">
<style>
:root{
  --paper:#eef2f6;
  --surface:#ffffff;
  --surface-2:#dbe4ee;
  --ink:#1c2b3a;
  --ink-soft:#5b7080;
  --line:rgba(28,43,58,0.12);
  --accent:#1e5fa8;
  --accent-ink:#f4f9ff;
  --success:#1f7a5c;
  --success-bg:#e0efe8;
  --danger:#b3392b;
  --danger-bg:#f5e4de;
  --focus:#1e6f66;
  --shadow: 0 1px 0 rgba(28,43,58,0.06);
}
.hero h1{ font-size:clamp(3.4rem, 13vw, 6.5rem); }
.hero .subtitle{ color:var(--ink); }

.card{ padding:36px 30px; }
.card p{
  max-width:520px;
  margin:0 auto;
  font-size:0.95rem;
  line-height:1.55;
  color:var(--ink);
}
.card + .card{ margin-top:20px; }
.card.mereni{ --accent:#2f7a4f; --accent-ink:#f2fbf5; }
.card.kvinta{ --accent:#c9581f; --accent-ink:#fff8f0; }

.actions{ margin-top:28px; }
a.btn{
  font-family:'Work Sans', sans-serif;
  font-weight:600;
  font-size:0.95rem;
  padding:12px 24px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
  transition:transform .05s ease, background .12s, filter .12s;
}
a.btn:active{ transform:translateY(1px); }
a.btn.primary{
  background:var(--accent);
  border-color:var(--accent);
  color:var(--accent-ink);
}
a.btn.primary:hover{ filter:brightness(1.1); }
a.btn:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }

footer{ margin-top:40px; }

@media (max-width:520px){
  .hero{ padding:44px 16px 32px; }
  .card{ padding:28px 18px; }
}
</style>
</head>
<body>

<div class="wrap">

  <div class="hero">
    <span class="hero-tag">Gymnázium</span>
    <h1>Fyzika</h1>
    <p class="subtitle">Rozcestník</p>
  </div>

  <div class="card mereni">
    <div class="section-tag">Sekce</div>
    <h2>Měření</h2>
    <p>Vysvětlení a procvičování zpracování měření</p>
    <div class="actions">
      <a class="btn primary" href="mereni.html">Vstoupit →</a>
    </div>
  </div>

  <div class="card kvinta">
    <div class="section-tag">Ročník</div>
    <h2>Kvinta/1. ročník</h2>
    <p>Pomůcky a procvičovací nástroje k fyzice pro kvintu / 1. ročník.</p>
    <div class="actions">
      <a class="btn primary" href="kvinta.html">Vstoupit →</a>
    </div>
  </div>

  <footer>Fyzika — Rozcestník</footer>
</div>

</body>
</html>
